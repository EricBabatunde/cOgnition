[project]
name = "rpg-cognitive-engine"
version = "0.1.0"
description = "A 4-Subsystem Modular Neuro-Symbolic Cognitive Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
    "z3-solver>=4.12.0",
    "networkx>=3.0",
    "rich>=13.0.0",
    "pyvis>=0.3.1",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
